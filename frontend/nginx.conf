server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Must be >= MAX_VIDEO_MB in the backend (plus multipart overhead).
    client_max_body_size ${MAX_UPLOAD_MB}m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /nginx-health { access_log off; return 200 "ok"; }

    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;      # video analysis can take minutes
        proxy_send_timeout 300s;
        proxy_request_buffering off;  # stream uploads to the backend
        # The backend already sets these; hide them so responses do not carry duplicates.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
    }

    # Hashed build assets: cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Single-page app: unknown paths (e.g. a refresh on /kitchen) serve index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
